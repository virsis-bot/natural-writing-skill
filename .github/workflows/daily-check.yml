name: Daily check of Signs of AI writing

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch article and diff with snapshot
        id: fetch
        run: python3 scripts/check_article.py

      - name: Update skill with Claude
        if: steps.fetch.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Edit,Write,Glob,Grep"'
          prompt: |
            The Wikipedia guide "Wikipedia:Signs of AI writing" changed.
            - source/last-diff.diff: what changed since the last check.
            - source/article.txt: the full current text of the guide.
            - skills/natural-writing/SKILL.md: the skill built from that guide.

            Decide whether the change matters for the skill. It matters when the
            guide adds a new sign, removes one, moves one to "Historical indicators"
            or "Ineffective indicators", or substantially changes how a sign is
            described. Also fix any existing gap between SKILL.md and the current
            guide that you notice. Copyedits, new examples of an already covered
            sign, reference fixes and talk about Wikipedia process do not matter.

            If it matters, edit skills/natural-writing/SKILL.md. Keep its structure,
            style, numbering scheme and length budget; the skill is for writers in
            English and Russian, so add a Russian equivalent where a natural one
            exists. Signs that apply only to Wikipedia editing (AfC, templates,
            user pages) stay out unless they generalize to ordinary prose.
            Then write a short plain-English summary of the skill changes to
            CHANGES.md (overwrite the file).

            If nothing matters, change no files.

      - name: Open PR if the skill changed
        id: skill
        if: steps.fetch.outputs.changed == 'true'
        run: |
          if git diff --quiet -- skills/; then
            echo "skill_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "skill_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.skill.outputs.skill_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/skill-update
          delete-branch: true
          commit-message: "Update natural-writing skill from Wikipedia guide"
          title: "Update natural-writing skill from Wikipedia guide"
          body-path: CHANGES.md
          add-paths: |
            skills/**
            source/**

      - name: Commit snapshot only
        if: steps.fetch.outputs.changed == 'true' && steps.skill.outputs.skill_changed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add source/
          git commit -m "Update article snapshot (no skill changes)"
          git push
